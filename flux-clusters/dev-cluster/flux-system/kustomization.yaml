apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-deployment
  namespace: wave2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mi-app
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
        - name: mi-contenedor
          image: nginx:latest
          ports:
            - containerPort: 80
